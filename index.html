<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="That Was Not There — a psychological rage-bait platformer where the environment betrays your assumptions.">
  <meta name="theme-color" content="#00e5ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Not There">

  <title>That Was Not There</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles/main.css?v=v5">
</head>
<body>

  <!-- Game Viewport Container (Active in landscape / desktop) -->
  <div id="game-container">
    <canvas id="game-canvas" aria-label="Game canvas"></canvas>

    <!-- Top Menu Button (Minimal, glassmorphic, accessible) -->
    <button id="btn-menu" class="glass-pill-btn" aria-label="Open game menu" title="Menu (Esc / P)">
      <span class="menu-icon-bars" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="menu-btn-label">MENU</span>
    </button>

    <!-- On-screen controls for touch devices -->
    <div id="touch-controls" role="toolbar" aria-label="Touch controls">
      <div class="touch-group touch-left-group">
        <button class="touch-btn" id="btn-left" aria-label="Move left">◀</button>
        <button class="touch-btn" id="btn-right" aria-label="Move right">▶</button>
      </div>
      <div class="touch-group touch-right-group">
        <button class="touch-btn touch-btn-jump" id="btn-jump" aria-label="Jump">▲</button>
      </div>
    </div>

    <!-- Small In-Game Menu Modal (Accessible via #btn-menu, ESC, or P) -->
    <div id="menu-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="modal-card">
        <div class="modal-header">
          <span class="modal-badge">PAUSED</span>
          <h2 id="menu-title" class="modal-title">That Was Not There</h2>
          <p id="menu-level-name" class="modal-subtitle">Room 01 / 20</p>
        </div>

        <div class="modal-actions">
          <button id="menu-btn-resume" class="modal-btn modal-btn-primary">
            <span class="btn-icon">▶</span> Resume Run
          </button>
          <button id="menu-btn-restart" class="modal-btn modal-btn-warning">
            <span class="btn-icon">↺</span> Restart Room
          </button>
          <button id="menu-btn-install" class="modal-btn modal-btn-secondary" style="display: none;">
            <span class="btn-icon">📥</span> Install App
          </button>
        </div>

        <div class="modal-settings">
          <div class="setting-row">
            <span class="setting-label">Sound FX</span>
            <button id="toggle-sound" class="toggle-switch active" role="switch" aria-checked="true" aria-label="Toggle sound effects">
              <span class="toggle-knob"></span>
            </button>
          </div>
          <div class="setting-row">
            <span class="setting-label">Ambient Drone</span>
            <button id="toggle-ambient" class="toggle-switch active" role="switch" aria-checked="true" aria-label="Toggle ambient audio">
              <span class="toggle-knob"></span>
            </button>
          </div>
          <div class="setting-row">
            <span class="setting-label">Reduced Motion</span>
            <button id="toggle-motion" class="toggle-switch" role="switch" aria-checked="false" aria-label="Toggle reduced motion">
              <span class="toggle-knob"></span>
            </button>
          </div>
        </div>

        <div class="modal-footer">
          <div class="keyboard-hints">
            <span><kbd>P</kbd> / <kbd>ESC</kbd> Pause</span>
            <span><kbd>R</kbd> Restart</span>
            <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> Move</span>
            <span><kbd>SPACE</kbd> Jump</span>
          </div>
          <p class="modal-footnote">100% Offline Progressive Web App</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Portrait orientation warning (mobile portrait detection) -->
  <div id="rotate-device-overlay" role="alert" aria-live="assertive">
    <div class="rotate-card">
      <div class="rotate-device-graphic" aria-hidden="true">
        <div class="device-body">
          <div class="device-notch"></div>
          <div class="device-inner-screen"></div>
        </div>
        <div class="rotate-arrows-svg">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M42 20 A 18 18 0 1 0 44 28" />
            <polyline points="44 14 44 22 36 22" />
          </svg>
        </div>
      </div>
      <h1 class="rotate-message">Rotate your device.</h1>
      <p class="rotate-hint">Landscape 16:9 mode is required to play</p>
    </div>
  </div>

  <script type="module" src="src/main.js?v=v5"></script>
</body>
</html>
